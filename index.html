<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Debug Astra</title>
  <style>
    body { background: #070b14; color: #fff; font: 14px monospace; padding: 20px; }
    #err { color: #ff6b6b; white-space: pre-wrap; margin-bottom: 20px; }
    #ok { color: #2dd4bf; }
    #root { min-height: 100px; border: 1px dashed #333; padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="err"></div>
  <div id="ok">Page loaded. Waiting for React...</div>
  <div id="root"></div>

  <script>
    window.onerror = function(msg, src, line, col) {
      var el = document.getElementById('err');
      el.textContent += 'ERROR: ' + msg + '\n  at ' + src + ':' + line + ':' + col + '\n\n';
      document.getElementById('ok').textContent = 'ERROR CAUGHT — see above';
    };
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('err').textContent += 'PROMISE REJECT: ' + e.reason + '\n\n';
    });
    // After 3 seconds, report whether React rendered anything
    setTimeout(function() {
      var root = document.getElementById('root');
      if (root.children.length === 0) {
        document.getElementById('ok').textContent = 'REACT DID NOT RENDER — root is empty';
      } else {
        document.getElementById('ok').textContent = 'REACT RENDERED — ' + root.children.length + ' element(s)';
      }
    }, 3000);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
