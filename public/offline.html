<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>Offline — Astra</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070b14;
      color: #eef1f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .offline-wrap { max-width: 440px; }
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 20px rgba(45, 212, 191, 0.4));
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 2rem;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #2dd4bf, #a855f7, #fb923c);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: #8a94ab; line-height: 1.7; margin-bottom: 24px; }
    button {
      background: #2dd4bf;
      color: #06231f;
      border: none;
      padding: 12px 26px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="offline-wrap">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Some pages may not load until you're back online.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
