<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="55%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>

    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <filter id="aGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="ring3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Orbit rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ring1)" stroke-width="3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring2)" stroke-width="3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#ring3)" stroke-width="3"/>

  <!-- Orbit dots -->
  <circle cx="256" cy="56" r="7" fill="#2dd4bf">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="256" r="6" fill="#a855f7">
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="376" cy="376" r="5" fill="#fb923c">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- The big A -->
  <g filter="url(#aGlow)">
    <text x="256" y="340" text-anchor="middle"
          font-family="Fraunces, Georgia, 'Times New Roman', serif"
          font-weight="700"
          font-size="300"
          fill="url(#aGrad)"
          letter-spacing="-6">A</text>
  </g>

  <!-- Star sparkles -->
  <circle cx="130" cy="140" r="2.5" fill="#fff" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="390" cy="160" r="2" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="320" r="2.5" fill="#fff" opacity="0.85">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="360" r="2" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.2s" repeatCount="indefinite"/>
  </circle>
</svg>
